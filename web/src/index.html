<title>Photorium 構圖相機</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/*__CSS__*/
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Photorium</div>
    <div class="readout" id="readout" aria-live="off">分析中…</div>
    <button class="icon-btn" id="camToggle" type="button" hidden>切換鏡頭</button>
  </header>

  <main class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <canvas id="view" aria-label="相機畫面與構圖參考線"></canvas>
      <div class="hint" id="hint" role="status"></div>
      <div class="src-tag" id="srcTag"></div>
    </div>
  </main>

  <section class="sheet" aria-label="構圖建議">
    <div class="notice" id="notice" hidden></div>
    <div class="modes" role="tablist" aria-label="檢視方式">
      <button type="button" role="tab" id="modeAim" class="mode on" aria-selected="true">取景提示</button>
      <button type="button" role="tab" id="modeCrop" class="mode" aria-selected="false">裁切預覽</button>
    </div>
    <div class="chips" id="chips" role="listbox" aria-label="建議的構圖"></div>
    <div class="detail">
      <h2 class="detail-title" id="detailTitle"></h2>
      <p class="reason" id="reason"></p>
      <ul class="tips" id="tips"></ul>
    </div>
    <div class="controls">
      <label class="side-btn" for="fileIn" id="fileBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg>
        <span>照片</span>
      </label>
      <input type="file" id="fileIn" accept="image/*" hidden>
      <button type="button" class="shutter" id="shutter" aria-label="拍照"><span></span></button>
      <button type="button" class="side-btn" id="sceneBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18l5-7 4 5 3-4 6 6z"/><circle cx="17" cy="7" r="2.2"/></svg>
        <span id="sceneLabel">示範</span>
      </button>
    </div>
  </section>

  <div class="result" id="result" hidden>
    <div class="result-inner">
      <div class="result-head">
        <h2 id="resultTitle">拍攝結果</h2>
        <div class="seg" role="tablist" aria-label="切換顯示">
          <button type="button" id="showCrop" class="on">構圖版本</button>
          <button type="button" id="showOrig">原圖</button>
        </div>
      </div>
      <div class="result-img"><img id="resultImg" alt="拍攝結果"></div>
      <p class="result-meta" id="resultMeta"></p>
      <div class="result-actions">
        <button type="button" class="btn primary" id="saveCrop">儲存構圖照片</button>
        <button type="button" class="btn" id="saveOrig">儲存原圖</button>
        <button type="button" class="btn ghost" id="closeResult">繼續拍攝</button>
      </div>
      <p class="toast" id="toast" role="status"></p>
    </div>
  </div>
</div>
<video id="video" playsinline muted autoplay></video>

<script>
/*__ENGINE__*/
</script>
<script>
/*__FACE__*/
</script>
